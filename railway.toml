# Railway deployment config for the TaskNest API (deployed from the monorepo root
# so pnpm resolves the @tasknest/shared workspace package during install).
[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @tasknest/api build"

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
